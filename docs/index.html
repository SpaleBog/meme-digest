<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dnevni Meme Digest – 04.05.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #18181c;
    --surface2: #222228;
    --accent: #ff4500;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #888;
    --border: #2a2a32;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 40% at 50% -10%, rgba(255,69,0,0.12) 0%, transparent 60%);
  }

  header {
    text-align: center;
    padding: 3rem 1rem 2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 8vw, 5rem);
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, #ff4500, #ff8c42);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .date-badge {
    display: inline-block;
    margin-top: 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 0.3rem 1.1rem;
    font-size: 0.85rem;
    color: var(--accent2);
    font-weight: 500;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
  }

  .sub-section {
    margin-bottom: 3.5rem;
  }

  .sub-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .sub-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--border), transparent);
    margin-left: 0.5rem;
  }

  .meme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.2rem;
  }

  .meme-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease;
    animation: fadeUp 0.4s ease both;
    animation-delay: calc(var(--i) * 0.05s);
  }

  .meme-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    padding: 0.5rem 0.8rem 0;
  }

  .meme-img-wrap {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .meme-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .no-img {
    font-size: 3rem;
    opacity: 0.3;
  }

  .meme-info {
    padding: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .meme-title {
    font-size: 0.88rem;
    line-height: 1.4;
    color: var(--text);
  }

  .meme-stats {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .stat {
    font-size: 0.78rem;
    background: var(--surface2);
    border-radius: 6px;
    padding: 0.2rem 0.6rem;
    color: var(--muted);
    font-weight: 500;
  }

  .stat.ups { color: var(--accent2); }

  .view-btn {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: color 0.15s;
  }

  .view-btn:hover { color: var(--accent2); }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 500px) {
    .meme-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">🔥 Meme Digest</div>
  <p class="tagline">Najbol­ji mimovi dana • Auto­matski sakupljeno</p>
  <span class="date-badge">📅 04.05.2026 u 02:07 CET</span>
</header>
<main>
  
        <section class="sub-section">
            <h2 class="sub-title">r/shitposting</h2>
            <div class="meme-grid"></div>
        </section>
        
        <section class="sub-section">
            <h2 class="sub-title">r/TheRealJoke</h2>
            <div class="meme-grid"></div>
        </section>
        
        <section class="sub-section">
            <h2 class="sub-title">r/blursedimages</h2>
            <div class="meme-grid"></div>
        </section>
        
</main>
<footer>
  Generisano automatski iz r/shitposting, r/TheRealJoke, r/blursedimages<br>
  Sortirano po: upvote-ovi × ratio | Poslednje ažuriranje: 04.05.2026 02:07
</footer>
</body>
</html>
